<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiny Dreamer Bedroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap">
<style>
/* Layout: one full-bleed WebGL canvas, a single glass toggle floating bottom-center. Single dark look by choice. */
:root{
  color-scheme: dark;
  --bg:#1a1022;
  --ink:#fff2e6;
  --glass:rgba(255,206,178,.14);
  --line:rgba(255,226,204,.38);
  --track:rgba(40,16,40,.35);
  --knob-a:#ffd58c; --knob-b:#ff7859;
  --glow:rgba(255,140,90,.75);
  --mono:'Fredoka','Nunito','Arial Rounded MT Bold',ui-rounded,system-ui,sans-serif;
}
body.night{
  --bg:#040817;
  --ink:#fff6d8;
  --glass:rgba(14,24,64,.4);
  --line:rgba(255,226,140,.38);
  --track:rgba(2,6,24,.55);
  --knob-a:#fff3b0; --knob-b:#8fb8ff;
  --glow:rgba(255,214,120,.65);
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);transition:background 1.6s}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity 1.4s ease}
canvas.on{opacity:1}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 58%,rgba(0,0,0,.38) 100%)}
#mode{
  position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  display:flex;align-items:center;gap:14px;padding:7px 20px 7px 7px;border-radius:999px;
  border:1px solid var(--line);background:var(--glass);color:var(--ink);
  -webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5);
  font:600 13px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;cursor:pointer;
  box-shadow:0 14px 44px -14px var(--glow),inset 0 1px 0 rgba(255,255,255,.22);
  transition:background 1.2s,border-color 1.2s,color 1.2s,box-shadow 1.2s,transform .25s;
  -webkit-tap-highlight-color:transparent;
}
#mode:hover{transform:translateX(-50%) translateY(-2px)}
#mode:active{transform:translateX(-50%) scale(.97)}
#mode:focus-visible{outline:2px solid var(--knob-a);outline-offset:4px}
.track{position:relative;width:60px;height:32px;border-radius:999px;background:var(--track);box-shadow:inset 0 1px 4px rgba(0,0,0,.4);transition:background 1.2s}
.knob{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;
  background:linear-gradient(135deg,var(--knob-a),var(--knob-b));box-shadow:0 0 16px var(--glow);
  transition:transform .8s cubic-bezier(.7,0,.2,1),box-shadow 1.2s;display:grid;place-items:center}
body.night .knob{transform:translateX(28px)}
.knob svg{position:absolute;width:14px;height:14px;transition:opacity .6s,transform .8s}
.knob .moon{opacity:0;transform:rotate(-60deg)}
body.night .knob .sun{opacity:0;transform:rotate(60deg)}
body.night .knob .moon{opacity:1;transform:none}
#err{position:fixed;left:16px;right:16px;top:16px;color:var(--ink);font:12px/1.5 var(--mono);text-align:center;opacity:.8}
.lbl{min-width:6.2em;text-align:left;transition:opacity .4s}
@media (prefers-reduced-motion: reduce){ .knob,.knob svg,canvas{transition:none} }
</style>

<div class="vig"></div>
<button id="mode" type="button" aria-pressed="false" aria-label="Switch to night mode">
  <span class="track"><span class="knob">
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="#3a1a10" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4.2" fill="#3a1a10"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.5 1.5M17.2 17.2l1.5 1.5M5.3 18.7l1.5-1.5M17.2 6.8l1.5-1.5"/></svg>
    <svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="#13204a"/></svg>
  </span></span>
  <span class="lbl">Sunset</span>
</button>

<div id="err" hidden></div>
<script>
addEventListener('error', e=>{ const el=document.getElementById('err'); el.hidden=false; el.textContent='Scene failed to load: '+(e.message||'a script could not be fetched'); }, true);
</script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/+esm';
import { EffectComposer } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/postprocessing/EffectComposer.js/+esm';
import { RenderPass } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/postprocessing/RenderPass.js/+esm';
import { UnrealBloomPass } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/postprocessing/UnrealBloomPass.js/+esm';
import { ShaderPass } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/postprocessing/ShaderPass.js/+esm';
import { OutputPass } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/postprocessing/OutputPass.js/+esm';
import { RoundedBoxGeometry } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/geometries/RoundedBoxGeometry.js/+esm';
import { RoomEnvironment } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/environments/RoomEnvironment.js/+esm';
import { RectAreaLightUniformsLib } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/lights/RectAreaLightUniformsLib.js/+esm';

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- deterministic randomness ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const rand = mulberry32(2088);
const R = (a,b)=>a+(b-a)*rand();
const pick = arr => arr[Math.floor(rand()*arr.length)];
const V = (x,y,z)=>new THREE.Vector3(x,y,z);
const C = c=>new THREE.Color(c);
const L = (a,b,m)=>a+(b-a)*m;

/* ---------- renderer ---------- */
const renderer = new THREE.WebGLRenderer({ antialias:false, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.prepend(renderer.domElement);
RectAreaLightUniformsLib.init();

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.4;

/* ---------- backdrop gradient ---------- */
const bgCanvas = document.createElement('canvas'); bgCanvas.width = 256; bgCanvas.height = 256;
const bgCtx = bgCanvas.getContext('2d');
const bgTex = new THREE.CanvasTexture(bgCanvas); bgTex.colorSpace = THREE.SRGBColorSpace;
scene.background = bgTex;
const _c1 = new THREE.Color(), _c2 = new THREE.Color();
const lc = (a,b,m)=>_c1.set(a).lerp(_c2.set(b),m).getStyle();
const lca = (a,b,m,al)=>{ const c=_c1.set(a).lerp(_c2.set(b),m).getRGB({r:0,g:0,b:0}, THREE.SRGBColorSpace); return `rgba(${c.r*255|0},${c.g*255|0},${c.b*255|0},${al})`; };
function drawBg(m){
  const g = bgCtx.createLinearGradient(0,0,0,256);
  g.addColorStop(0, lc('#3a2350','#02040d',m));
  g.addColorStop(.55, lc('#c46c86','#0b1638',m));
  g.addColorStop(1, lc('#ffc08c','#1c2a5e',m));
  bgCtx.fillStyle = g; bgCtx.fillRect(0,0,256,256);
  const r = bgCtx.createRadialGradient(128,104,0,128,104,150);
  r.addColorStop(0, lca('#ffe2b0','#4a6cff',m,L(0.6,0.4,m)));
  r.addColorStop(1, 'rgba(0,0,0,0)');
  bgCtx.fillStyle = r; bgCtx.fillRect(0,0,256,256);
  bgTex.needsUpdate = true;
}

/* ---------- camera ---------- */
const camera = new THREE.OrthographicCamera(-1,1,1,-1,40,280);
const target = V(0,2.6,0);
const baseDir = V(1,0.9,1).normalize();       // camera sits along this direction from target
const CAM_DIST = 90;
const right = V(1,0,-1).normalize();          // screen-right in world, horizontal

/* ---------- helpers ---------- */
const room = new THREE.Group(); scene.add(room);
function mesh(geo, mat, x=0,y=0,z=0, parent=room, shadow=true){
  const m = new THREE.Mesh(geo, mat); m.position.set(x,y,z);
  m.castShadow = m.receiveShadow = shadow; parent.add(m); return m;
}
const box  = (w,h,d,mat,x,y,z,p)=>mesh(new THREE.BoxGeometry(w,h,d),mat,x,y,z,p);
const rbox = (w,h,d,r,mat,x,y,z,p)=>mesh(new RoundedBoxGeometry(w,h,d,3,r),mat,x,y,z,p);
const cyl  = (rt,rb,h,mat,x,y,z,p,seg=32)=>mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat,x,y,z,p);
const sph  = (r,mat,x,y,z,p)=>mesh(new THREE.SphereGeometry(r,32,20),mat,x,y,z,p);
const std  = (color, roughness=0.7, metalness=0, o={})=>new THREE.MeshStandardMaterial({color, roughness, metalness, ...o});
function stick(a,b,r,mat,parent=room){
  const d = new THREE.Vector3().subVectors(b,a);
  const m = mesh(new THREE.CylinderGeometry(r,r,d.length(),12), mat, 0,0,0, parent);
  m.position.copy(a).add(b).multiplyScalar(.5);
  m.quaternion.setFromUnitVectors(V(0,1,0), d.normalize());
  return m;
}
// emissive-looking materials that blend between the two moods
const glows = [];
function glow(cSun, cNight, kSun=1, kNight=1, neon=false){
  const mat = new THREE.MeshBasicMaterial({ color:cSun });
  glows.push({ mat, a:C(cSun).multiplyScalar(kSun), b:C(cNight).multiplyScalar(kNight), neon });
  return mat;
}
const glowMesh = (geo, mat, x,y,z, p=room)=>mesh(geo, mat, x,y,z, p, false);

const glass = new THREE.MeshPhysicalMaterial({ color:'#ffffff', metalness:0, roughness:0.04, transmission:1, thickness:0.5, ior:1.5, clearcoat:1, clearcoatRoughness:0.04, envMapIntensity:1.3 });
const frosted = glass.clone(); frosted.roughness = 0.32; frosted.thickness = 0.8;

/* ---------- canvas textures ---------- */
function canvasTex(w,h,draw){
  const c = document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'),w,h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
const floorTex = canvasTex(1024,1024,(g,W,H)=>{
  const rows = 11, rh = H/rows;
  for(let r=0;r<rows;r++){
    let x = -R(0,320);
    while(x < W){
      const len = R(240,560);
      g.fillStyle = `hsl(${R(22,30)},${R(38,50)}%,${R(44,54)}%)`; g.fillRect(x, r*rh, len, rh);
      for(let k=0;k<9;k++){ g.fillStyle=`rgba(70,34,16,${R(0.03,0.1)})`; g.fillRect(x, r*rh+R(0,rh), len, R(1,3)); }
      g.fillStyle='rgba(38,18,8,.55)'; g.fillRect(x, r*rh, 2, rh);
      x += len;
    }
    g.fillStyle='rgba(38,18,8,.5)'; g.fillRect(0, r*rh, W, 2);
  }
});
const rugTex = canvasTex(512,512,(g,W)=>{
  const rings = ['#efe2cf','#d9785a','#efe2cf','#e9b44c','#efe2cf','#3f6f7a','#efe2cf'];
  rings.forEach((c,i)=>{ g.fillStyle=c; g.beginPath(); g.arc(W/2,W/2,W/2*(1-i*0.13),0,Math.PI*2); g.fill(); });
  for(let i=0;i<4000;i++){ g.fillStyle=`rgba(0,0,0,${R(0,.05)})`; g.fillRect(R(0,W),R(0,W),1,1); }
});

/* ---------- room shell ---------- */
const S = 5, H = 7.8, T = 0.3;
const WIN = { x0:-2.3, x1:3.9, y0:2.7, y1:6.8 };
const Wc = V((WIN.x0+WIN.x1)/2, (WIN.y0+WIN.y1)/2, -S-T/2);

const wallMat = std('#f8e6d2', 0.92);
const capMat = std('#2a2033', 0.6);
const pedMat = std('#1d1828', 0.55, 0.1);
const floorMat = new THREE.MeshPhysicalMaterial({ map:floorTex, roughness:0.48, clearcoat:0.45, clearcoatRoughness:0.22 });

// floor slab + pedestal
mesh(new THREE.BoxGeometry(2*S+T, 0.4, 2*S+T), [pedMat,pedMat,floorMat,pedMat,pedMat,pedMat], -T/2, -0.2, -T/2);
const PW = 2*S+T+0.8, PC = -T/2;
rbox(PW, 1.0, PW, 0.14, pedMat, PC, -0.9, PC);
const pedGlow = glow('#ffb27a', '#ffd27a', 0.6, 1.15);
[[PW,0.05,0.05,PC,PC+PW/2],[PW,0.05,0.05,PC,PC-PW/2],[0.05,0.05,PW,PC+PW/2,PC],[0.05,0.05,PW,PC-PW/2,PC]]
  .forEach(([w,h,d,x,z])=>glowMesh(new THREE.BoxGeometry(w,h,d), pedGlow, x,-0.42,z));
// soft contact shadow under the floating block
const shadowTex = canvasTex(256,256,(g,W)=>{ const r=g.createRadialGradient(W/2,W/2,0,W/2,W/2,W/2); r.addColorStop(0,'rgba(0,0,0,.6)'); r.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=r; g.fillRect(0,0,W,W); });
const shadowPlane = new THREE.Mesh(new THREE.PlaneGeometry(24,24), new THREE.MeshBasicMaterial({ map:shadowTex, transparent:true, depthWrite:false }));
shadowPlane.rotation.x = -Math.PI/2; shadowPlane.position.set(PC,-2.4,PC); scene.add(shadowPlane);

// walls (back wall built around the window opening)
box(T, H, 2*S+T, wallMat, -S-T/2, H/2, -T/2);
const bz = -S-T/2;
box(2*S, WIN.y0, T, wallMat, 0, WIN.y0/2, bz);
box(2*S, H-WIN.y1, T, wallMat, 0, (H+WIN.y1)/2, bz);
box(WIN.x0+S, WIN.y1-WIN.y0, T, wallMat, (WIN.x0-S)/2, Wc.y, bz);
box(S-WIN.x1, WIN.y1-WIN.y0, T, wallMat, (WIN.x1+S)/2, Wc.y, bz);
// cut-away caps
box(T+0.02, 0.05, 2*S+T+0.02, capMat, -S-T/2, H+0.025, -T/2);
box(2*S, 0.05, T+0.02, capMat, 0, H+0.025, bz);
// baseboards
const baseMat = std('#f6efe7',0.6);
box(0.06,0.28,2*S, baseMat, -S+0.03,0.14,0);
box(2*S,0.28,0.06, baseMat, 0,0.14,-S+0.03);
// invisible shadow casters: close the box for lighting so light only enters through the window
const ghost = new THREE.MeshBasicMaterial({ colorWrite:false, depthWrite:false });
[[2*S+T,0.2,2*S+T,-T/2,H+0.1,-T/2],[T,H,2*S+T,S+T/2,H/2,-T/2],[2*S+T,H,T,-T/2,H/2,S+T/2]].forEach(([w,h,d,x,y,z])=>{
  const g = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), ghost); g.position.set(x,y,z); g.castShadow = true; scene.add(g);
});

/* ---------- window ---------- */
const frameMat = std('#26222e', 0.35, 0.6);
const ww = WIN.x1-WIN.x0, wh = WIN.y1-WIN.y0;
box(ww, 0.12, 0.36, frameMat, Wc.x, WIN.y0+0.06, bz);
box(ww, 0.12, 0.36, frameMat, Wc.x, WIN.y1-0.06, bz);
box(0.12, wh, 0.36, frameMat, WIN.x0+0.06, Wc.y, bz);
box(0.12, wh, 0.36, frameMat, WIN.x1-0.06, Wc.y, bz);
box(0.07, wh, 0.12, frameMat, Wc.x, Wc.y, bz);
box(ww, 0.07, 0.12, frameMat, Wc.x, WIN.y0+wh*0.68, bz);
box(ww+0.5, 0.1, 0.5, baseMat, Wc.x, WIN.y0-0.03, -S+0.2);
const winGlass = new THREE.MeshPhysicalMaterial({ color:'#cfe8ff', transparent:true, opacity:0.05, roughness:0.02, metalness:0, clearcoat:0.3, envMapIntensity:0.5, depthWrite:false });
mesh(new THREE.PlaneGeometry(ww, wh), winGlass, Wc.x, Wc.y, bz+0.07, room, false);
// curtain + rod
const cg = new THREE.PlaneGeometry(1.2, 5.6, 40, 1);
{ const p = cg.attributes.position; for(let i=0;i<p.count;i++){ const x=p.getX(i); p.setZ(i, Math.sin(x*15)*0.07 + Math.sin(x*6)*0.03); } cg.computeVertexNormals(); }
const curtain = mesh(cg, std('#f6ece2',0.95,0,{ side:THREE.DoubleSide, transparent:true, opacity:0.9 }), -2.95, 4.25, -4.88);
cyl(0.035,0.035,8.2, frameMat, 0.4, 7.12, -4.86).rotation.z = Math.PI/2;

/* ---------- palette ---------- */
const deskTop = std('#fff7ee', 0.5);
const mint  = std('#8fd3c1', 0.6);
const coral = std('#ff8a7a', 0.6);
const sunY  = std('#ffd25a', 0.55);
const skyB  = std('#7cc4f2', 0.6);
const lilac = std('#b9a2e8', 0.65);
const pinkM = std('#ffb3c7', 0.65);
const woodL = std('#e8c9a0', 0.6);
const white = std('#fffaf4', 0.55);
const kidCols = ['#ff8a7a','#ffd25a','#7cc4f2','#8fd3c1','#b9a2e8','#ffb3c7','#ffa94d','#6bcf7f'];

/* ---------- wainscot + chair rail ---------- */
const wainMat = std('#bfe3d6', 0.85);
box(0.04, 2.2, 2*S, wainMat, -S+0.02, 1.1, 0);
box(2*S, 2.2, 0.04, wainMat, 0, 1.1, -S+0.02);
box(0.08, 0.08, 2*S, baseMat, -S+0.04, 2.24, 0);
box(2*S, 0.08, 0.08, baseMat, 0, 2.24, -S+0.04);

/* ---------- small builders ---------- */
function crayon(x,y,z,color,ry=0,standing=false,parent=room){
  const g = new THREE.Group(); g.position.set(x,y,z); parent.add(g);
  const m = std(color,0.45);
  cyl(0.035,0.035,0.3, m, 0,0,0, g, 12);
  cyl(0.037,0.037,0.18, std('#ffffff',0.7).clone(), 0,-0.02,0, g, 12).material.color.set(color).lerp(C('#ffffff'),0.55);
  mesh(new THREE.ConeGeometry(0.035,0.08,12), m, 0,0.19,0, g);
  if(standing) g.rotation.set(R(-0.15,0.15),0,R(-0.15,0.15)); else { g.rotation.set(0, ry, Math.PI/2); g.position.y += 0.035; }
  return g;
}
function book(x,y,z,w,h,d,color,parent=room){ return rbox(w,h,d,Math.min(w,h,d)*0.3, std(color,0.7), x,y,z,parent); }
function openBook(x,y,z,ry,coverCol,parent=room){
  const g = new THREE.Group(); g.position.set(x,y,z); g.rotation.y = ry; parent.add(g);
  box(0.82,0.025,0.56, std(coverCol,0.6), 0,0.012,0, g);
  const pageTex = canvasTex(256,180,(c,W,H)=>{
    c.fillStyle='#fffdf6'; c.fillRect(0,0,W,H);
    c.fillStyle='#7cc4f2'; c.fillRect(14,14,W/2-28,H*0.55);
    c.fillStyle='#ffd25a'; c.beginPath(); c.arc(W/4+20,40,16,0,Math.PI*2); c.fill();
    c.fillStyle='#6bcf7f'; c.beginPath(); c.ellipse(W/4,H*0.55+8,W/4-10,22,0,Math.PI,0); c.fill();
    c.fillStyle='#ff8a7a'; c.beginPath(); c.moveTo(W*0.62,H*0.5); c.lineTo(W*0.75,H*0.25); c.lineTo(W*0.88,H*0.5); c.fill();
    c.fillStyle='#ffe2b8'; c.fillRect(W*0.65,H*0.5,W*0.2,H*0.2);
    c.fillStyle='rgba(60,50,70,.35)'; for(let i=0;i<3;i++){ c.fillRect(18,H*0.72+i*12,W/2-40,4); c.fillRect(W/2+16,H*0.78+i*12,W/2-40,4); }
    c.fillStyle='rgba(0,0,0,.08)'; c.fillRect(W/2-2,0,4,H);
  });
  const pageMat = new THREE.MeshStandardMaterial({ map:pageTex, roughness:0.85 });
  const p = mesh(new THREE.BoxGeometry(0.78,0.03,0.52), [white,white,pageMat,white,white,white], 0,0.04,0, g);
  return g;
}
function shoe(x,z,ry,col,parent=room){
  const g = new THREE.Group(); g.position.set(x,0,z); g.rotation.y = ry; parent.add(g);
  rbox(0.55,0.08,0.24,0.035, white, 0,0.04,0, g);
  rbox(0.42,0.17,0.22,0.08, std(col,0.6), -0.04,0.15,0, g);
  sph(0.1, std(col,0.6), 0.16,0.11,0, g).scale.set(1.2,0.75,1.05);
  box(0.02,0.02,0.18, white, 0.02,0.245,0, g);
  box(0.02,0.02,0.18, white, 0.09,0.225,0, g);
  return g;
}
function shirt(x,z,ry,col,parent=room){
  const s = new THREE.Shape();
  s.moveTo(-0.3,-0.4); s.lineTo(0.3,-0.4); s.lineTo(0.3,0.15); s.lineTo(0.5,0.05); s.lineTo(0.6,0.25); s.lineTo(0.28,0.42);
  s.quadraticCurveTo(0,0.3,-0.28,0.42); s.lineTo(-0.6,0.25); s.lineTo(-0.5,0.05); s.lineTo(-0.3,0.15); s.closePath();

const CLIP_GLSL = `
uniform vec2 uQ[4]; uniform float uQs;
float qe(vec2 a, vec2 b, vec2 p){ return ((b.x-a.x)*(p.y-a.y)-(b.y-a.y)*(p.x-a.x))*uQs; }
bool inWin(vec2 p){ return qe(uQ[0],uQ[1],p)>=0. && qe(uQ[1],uQ[2],p)>=0. && qe(uQ[2],uQ[3],p)>=0. && qe(uQ[3],uQ[0],p)>=0.; }
`;
function clipSrc(src){ return CLIP_GLSL + src.replace(/void main\(\)\s*\{/, 'void main(){ if(!inWin(gl_FragCoord.xy)) discard;'); }
function clipShader(mat){ mat.uniforms.uQ = winQuad; mat.uniforms.uQs = winSign; mat.fragmentShader = clipSrc(mat.fragmentShader); return mat; }
function clipBuiltin(mat){ mat.onBeforeCompile = sh=>{ sh.uniforms.uQ = winQuad; sh.uniforms.uQs = winSign; sh.fragmentShader = clipSrc(sh.fragmentShader); }; return mat; }

const _bufSize = new THREE.Vector2(), _pv = new THREE.Vector3();
function updateWinQuad(){
  renderer.getDrawingBufferSize(_bufSize);
  winCorners.forEach((c,i)=>{ _pv.copy(c).project(camera); winQuad.value[i].set((_pv.x*0.5+0.5)*_bufSize.x, (_pv.y*0.5+0.5)*_bufSize.y); });
  const q = winQuad.value; let area = 0;
  for(let i=0;i<4;i++){ const a=q[i], b=q[(i+1)%4]; area += a.x*b.y - b.x*a.y; }
  winSign.value = area >= 0 ? 1 : -1;
}

    float h21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
    float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
      return mix(mix(h21(i),h21(i+vec2(1,0)),f.x), mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x), f.y); }
    void main(){
      vec2 p = vP;
      // sunset
      vec3 s = mix(vec3(1.0,0.5,0.24), vec3(0.82,0.27,0.3), smoothstep(-1.5,0.5,p.y));
      s = mix(s, vec3(0.24,0.1,0.3), smoothstep(0.5,2.4,p.y));
      float d = length(p - vec2(-0.55,0.15));
      s += vec3(1.0,0.5,0.22)*exp(-d*1.5)*0.75;
      float cl = noise(vec2(p.x*0.9 + uTime*0.015, p.y*5.0)) * smoothstep(-0.4,0.5,p.y) * smoothstep(2.2,0.7,p.y);
      s = mix(s, vec3(1.0,0.48,0.5), smoothstep(0.5,0.85,cl)*0.55);
      vec3 sunC = mix(vec3(4.2,2.8,1.3), vec3(3.6,1.6,0.8), smoothstep(0.7,-0.4,p.y));
      float band = step(0.4, fract((p.y-0.15)*9.0)) + step(0.0, p.y);
      s = mix(s, sunC, smoothstep(0.52,0.49,d) * clamp(band,0.,1.));
      // night
      vec3 n = mix(vec3(0.12,0.12,0.36), vec3(0.03,0.04,0.16), smoothstep(-1.8,0.1,p.y));
      n = mix(n, vec3(0.008,0.008,0.03), smoothstep(0.1,2.3,p.y));
      vec2 sp = floor(p*30.); float st = step(0.982, h21(sp));
      float tw = 0.55 + 0.45*sin(uTime*2.0 + h21(sp+3.)*40.);
      n += st*tw*smoothstep(-0.6,0.9,p.y)*vec3(1.0,0.95,1.3)*smoothstep(0.42,0.0,length(fract(p*30.)-0.5))*1.4;
      vec2 q = p - vec2(0.75,0.7); float pd = length(q);
      float pm = smoothstep(0.42,0.40,pd) * (1.0 - smoothstep(0.36,0.34,length(q - vec2(0.17,0.1))));
      n += vec3(0.5,0.6,1.0)*exp(-pd*2.6)*0.35;
      n = mix(n, vec3(2.2,2.0,1.5), pm);
      gl_FragColor = vec4(max(mix(s, n, uMix), 0.0), 1.0);
    }`,
  depthWrite:false
});
clipShader(skyMat);
const sky = new THREE.Mesh(new THREE.PlaneGeometry(70,70), skyMat);
sky.renderOrder = 2; scene.add(sky);

// buildings: one instanced mesh, procedural facades
const bMat = new THREE.ShaderMaterial({
  uniforms:{ uMix:{value:0}, uTime:{value:0}, uWc:{value:Wc}, uDir:{value:dir} },
  vertexShader:`
    varying vec3 vW, vN, vS, vL;
    void main(){
      vL = position;
      vec4 w = modelMatrix * instanceMatrix * vec4(position,1.);
      vW = w.xyz;
      vN = normalize(mat3(modelMatrix) * mat3(instanceMatrix) * normal);
      #ifdef USE_INSTANCING_COLOR
        vS = instanceColor;
      #else
        vS = vec3(.5);
      #endif
      gl_Position = projectionMatrix * viewMatrix * w;
    }`,
  fragmentShader:`
    uniform float uMix, uTime; uniform vec3 uWc, uDir;
    varying vec3 vW, vN, vS, vL;
    float h21(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
    void main(){
      vec3 n = normalize(vN);
      float side = step(abs(n.y), 0.5);
      float depth = dot(vW - uWc, uDir);
      float rel = vW.y - (uWc.y + uDir.y*depth);
      bool fx = abs(n.x) > 0.5;
      vec2 f = fx ? vec2(vW.z, vW.y) : vec2(vW.x, vW.y);
      vec2 cs = vec2(0.34, 0.46);
      vec2 id = floor(f/cs), g = fract(f/cs);
      float wm = step(0.2,g.x)*step(g.x,0.8)*step(0.24,g.y)*step(g.y,0.76);
      float r = h21(id + vS.r*173.1 + (fx?7.3:0.));
      float r2 = h21(id*1.7 + vS.g*91.3);
      float shade = fx ? 1.0 : 0.7;
      // sunset: backlit silhouettes with amber windows
      vec3 baseS = mix(vec3(0.07,0.035,0.08), vec3(0.14,0.07,0.11), vS.b) * shade;
      vec3 winS = vec3(1.1,0.6,0.28)*(0.55+0.6*r2);
      vec3 colS = mix(mix(vec3(0.26,0.12,0.16)*(0.6+0.4*vS.b), baseS, side), winS, side*wm*step(0.74,r));
      // night: deep facades, mixed window colors, neon trims
      vec3 baseN = mix(vec3(0.01,0.01,0.028), vec3(0.03,0.02,0.06), vS.b) * shade;
      vec3 pal = r2 < 0.55 ? vec3(1.7,1.15,0.6) : r2 < 0.76 ? vec3(1.3,1.4,1.7) : r2 < 0.89 ? vec3(0.25,1.5,2.2) : vec3(2.2,0.35,1.5);
      float flick = step(0.05, h21(id + floor(uTime*0.4 + r*20.)));
      vec3 colN = mix(mix(vec3(0.05,0.03,0.09), baseN, side), pal*(0.6+0.5*r2), side*wm*step(0.48,r)*flick);
      float u = fx ? vL.z : vL.x;
      float edge = step(0.468, abs(u)) * step(0.7, vS.g) * side;
      float crown = step(0.4988, vL.y) * step(0.42, vS.g) * side;  // ~0.1 world units on a 90-unit tower
      float bands = step(0.97, fract(vL.y*45.0)) * step(0.93, vS.g) * side;
      vec3 neon = vS.r > 0.5 ? vec3(0.4,1.6,2.8) : vec3(2.8,1.9,0.6);
      float nm = max(max(edge, crown), bands);
      colN = mix(colN, neon, nm);
      colS = mix(colS, vec3(0.32,0.16,0.2), nm*0.6);
      vec3 col = mix(colS, colN, uMix);
      // atmospheric haze by distance + low-lying mist
      float fd = smoothstep(14.0, 110.0, depth);
      float fh = smoothstep(-0.6, -2.4, rel);
      vec3 hazeS = mix(vec3(0.7,0.32,0.3), vec3(0.62,0.26,0.32), smoothstep(-2.0,1.0,rel));
      vec3 hazeN = mix(vec3(0.05,0.06,0.18), vec3(0.03,0.04,0.12), smoothstep(-2.0,0.5,rel));
      float fog = clamp(fd*0.5 + fh*(0.12+0.3*fd), 0., 0.85);
      col = mix(col, mix(hazeS, hazeN, uMix), fog);
      gl_FragColor = vec4(max(col, 0.0), 1.0);
    }`,
});
clipShader(bMat);
{
  const N = 380;
  const city = new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1), bMat, N);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), col = new THREE.Color();
  for(let i=0;i<N;i++){
    const t = 10 + Math.pow(rand(),1.25)*85;
    const sx = R(-1,1)*(3.6 + t*0.1);
    let sy, w = R(0.9,2.4), d = R(0.9,2.4);
    const tower = t < 26 && Math.abs(sx) > 2.7 && rand() < 0.5;
    if(tower){ sy = R(0.8,2.8); w = R(0.8,1.3); d = R(0.8,1.3); }
    else if(t < 26) sy = R(-1.7,-0.35);
    else if(t < 55) sy = R(-1.6,-0.15);
    else sy = R(-1.7,-0.5);
    const top = cityPoint(t, sx, sy);
    const h = 90;
    m4.compose(V(top.x, top.y-h/2, top.z), q, V(w,h,d));
    city.setMatrixAt(i, m4);
    city.setColorAt(i, col.setRGB(rand(), rand(), rand()));
  }
  city.renderOrder = 3; city.frustumCulled = false; scene.add(city);
}

// flying traffic lanes
const carMat = clipBuiltin(new THREE.MeshBasicMaterial({ color:'#ffffff' }));
const lanes = [];
for(let l=0;l<6;l++) lanes.push({ t:R(11,50), sy:R(-1.3,1.5), dir: l%2 ? 1 : -1, speed:R(1.2,2.6) });
const CARS_PER = 9, cars = [];
const carMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(0.5,0.045,0.045), carMat, lanes.length*CARS_PER);
carMesh.renderOrder = 3; carMesh.frustumCulled = false;
lanes.forEach((ln,li)=>{ for(let k=0;k<CARS_PER;k++){
  const c = { ln, sx:R(-6,6), sp:ln.speed*R(0.85,1.15), dy:R(-0.06,0.06) };
  cars.push(c);
  carMesh.setColorAt(cars.length-1, C(ln.dir>0 ? pick(['#fff4d6','#ffffff','#9ff6ff']) : pick(['#ff3b4f','#ff6a3b','#ff3fa4'])));
}});
scene.add(carMesh);
const carQ = new THREE.Quaternion().setFromAxisAngle(V(0,1,0), Math.PI/4);

// holographic billboards
const holoDraw = [
  (g,W,Hh)=>{ g.strokeStyle='#ff4fb4'; g.lineWidth=10; g.shadowColor='#ff4fb4'; g.shadowBlur=24; g.beginPath(); g.arc(W/2,Hh/2,W*0.32,0,Math.PI*2); g.stroke(); g.beginPath(); g.arc(W/2,Hh/2,W*0.12,0,Math.PI*2); g.fillStyle='#ff9ad6'; g.fill(); },
  (g,W,Hh)=>{ g.fillStyle='#3ff0ff'; g.shadowColor='#3ff0ff'; g.shadowBlur=18; for(let i=0;i<7;i++){ g.fillRect(W*0.2, Hh*0.1+i*Hh*0.115, W*(0.25+((i*37)%50)/100), Hh*0.06);} },
  (g,W,Hh)=>{ g.strokeStyle='#ffd23f'; g.lineWidth=12; g.shadowColor='#ffb03f'; g.shadowBlur=24; g.beginPath(); g.moveTo(W/2,Hh*0.18); g.lineTo(W*0.82,Hh*0.8); g.lineTo(W*0.18,Hh*0.8); g.closePath(); g.stroke(); },
  (g,W,Hh)=>{ g.strokeStyle='#7dffb5'; g.lineWidth=8; g.shadowColor='#3ff0ff'; g.shadowBlur=20; g.beginPath(); for(let x=0;x<=W;x+=4){ const y=Hh/2+Math.sin(x*0.06)*Hh*0.18*Math.sin(x*0.013); x?g.lineTo(x,y):g.moveTo(x,y);} g.stroke(); },
];
const holos = [];
[[16,-2.6,0.9,1.0,1.4,0],[22,2.4,-0.1,0.9,0.6,1],[30,-0.6,-0.6,0.9,0.9,2],[13,-1.9,0.7,1.0,0.45,3],[40,3.0,-0.9,0.8,1.1,1],[26,-3.3,-0.4,0.7,0.7,0]].forEach(([t,sx,sy,w,h,k])=>{
  const tex = canvasTex(256,256,(g,W,Hh)=>{ g.strokeStyle='rgba(255,255,255,.35)'; g.lineWidth=3; g.strokeRect(8,8,W-16,Hh-16); holoDraw[k](g,W,Hh); });
  const mat = new THREE.MeshBasicMaterial({ map:tex, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending });
  clipBuiltin(mat);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w,h), mat);
  m.position.copy(cityPoint(t,sx,sy)); m.lookAt(m.position.clone().add(baseDir)); m.frustumCulled = false;
  scene.add(m); holos.push({ m, mat, ph:R(0,10) });
});

// hot-air balloons drifting over the city
const balloonTex = canvasTex(256,128,(c,W,H)=>{ const cs=['#ff6b6b','#ffd25a','#6bcfd4','#fffaf0','#ff9ec4','#7cc4f2']; for(let i=0;i<12;i++){ c.fillStyle=cs[i%cs.length]; c.fillRect(i*W/12,0,W/12+1,H); } });
const balloonMat = clipBuiltin(new THREE.MeshBasicMaterial({ map:balloonTex }));
const basketMat = clipBuiltin(new THREE.MeshBasicMaterial({ color:'#8a5a3a' }));
const balloons = [[14,-1.2,0.75,0.42],[24,1.6,1.05,0.32],[38,-2.4,0.2,0.26],[30,0.4,1.45,0.22]].map(([t,sx,sy,r],i)=>{
  const g = new THREE.Group();
  const env = new THREE.Mesh(new THREE.SphereGeometry(r,24,16), balloonMat); env.scale.set(1,1.15,1); env.position.y = r*0.9; g.add(env);
  const bk = new THREE.Mesh(new THREE.BoxGeometry(r*0.4,r*0.3,r*0.4), basketMat); bk.position.y = -r*0.55; g.add(bk);
  g.children.forEach(o=>o.frustumCulled=false); scene.add(g);
  return { g, t, sx, sy, ph:i*1.7 };
});

/* ---------- post ---------- */
const rt = new THREE.WebGLRenderTarget(1,1,{ type:THREE.HalfFloatType, depthBuffer:true, samples:4 });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
// guard: some GPUs emit NaN/Inf in a few pixels, which bloom would smear into big black blocks
composer.addPass(new ShaderPass({
  uniforms:{ tDiffuse:{ value:null } },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader:`uniform sampler2D tDiffuse; varying vec2 vUv;
    void main(){ vec4 c = texture2D(tDiffuse, vUv);
      bool bad = !(c.r == c.r) || !(c.g == c.g) || !(c.b == c.b) || c.r > 6e4 || c.g > 6e4 || c.b > 6e4;
      gl_FragColor = bad ? vec4(0.,0.,0.,1.) : vec4(clamp(c.rgb, 0., 40.), 1.); }`
}));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.4, 0.5, 0.92);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ---------- framing ---------- */
const bounds = [V(-5.7,-1.45,-5.7),V(5.4,-1.45,-5.7),V(-5.7,-1.45,5.4),V(5.4,-1.45,5.4),V(-5.3,7.9,-5.3),V(-5.3,7.9,5.0),V(5.0,7.9,-5.3),V(-4.4,5.2,4.4)];
function fit(){
  const w = innerWidth, h = innerHeight, padBot = Math.min(110, h*0.14);
  camera.position.copy(target).addScaledVector(baseDir, CAM_DIST); camera.lookAt(target); camera.updateMatrixWorld();
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(const b of bounds){ const v=b.clone().applyMatrix4(camera.matrixWorldInverse); x0=Math.min(x0,v.x); x1=Math.max(x1,v.x); y0=Math.min(y0,v.y); y1=Math.max(y1,v.y); }
  const cw = x1-x0, ch = y1-y0;
  const upp = Math.max(cw/(w*0.9), ch/((h-padBot)*0.9));
  const cx = (x0+x1)/2, cy = (y0+y1)/2 - (padBot/2)*upp;
  camera.left = cx - w*upp/2; camera.right = cx + w*upp/2;
  camera.top = cy + h*upp/2; camera.bottom = cy - h*upp/2;
  camera.updateProjectionMatrix();
  renderer.setSize(w,h,false); composer.setSize(w,h);
}
addEventListener('resize', fit); fit();

/* ---------- mood blending ---------- */
const P = {
  sunC:[C('#ffb36b'),C('#9fb4ff')], sunI:[4.4,0.6],
  hemiS:[C('#ffe2c4'),C('#3d55b8')], hemiG:[C('#6a4a5a'),C('#0b1026')], hemiI:[0.62,0.3],
  rectC:[C('#ff9d6a'),C('#6f8dff')], rectI:[3.2,2.6],
  lampI:[1.5,4], nightI:[0,7], fairyI:[0,5], teeI:[0.6,5],
  env:[0.28,0.12], exp:[1.0,1.0], bloom:[0.3,0.6],
  shaftC:[C('#ffb070'),C('#8fa6ff')], shaftI:[0.11,0.06],
  wall:[C('#f2d2b8'),C('#8e9ccc')], dust:[C('#ffd2a0'),C('#fff0a8')],
};
let lastBg = -1;
function applyMix(m, flick=1){
  sun.color.lerpColors(P.sunC[0],P.sunC[1],m); sun.intensity = L(P.sunI[0],P.sunI[1],m);
  hemi.color.lerpColors(P.hemiS[0],P.hemiS[1],m); hemi.groundColor.lerpColors(P.hemiG[0],P.hemiG[1],m); hemi.intensity = L(P.hemiI[0],P.hemiI[1],m);
  rect.color.lerpColors(P.rectC[0],P.rectC[1],m); rect.intensity = L(P.rectI[0],P.rectI[1],m);
  lampL.intensity = L(P.lampI[0],P.lampI[1],m);
  nightL.intensity = L(P.nightI[0],P.nightI[1],m);
  fairyL.intensity = fairyL2.intensity = L(P.fairyI[0],P.fairyI[1],m)*flick;
  teeL.intensity = L(P.teeI[0],P.teeI[1],m)*flick;
  scene.environmentIntensity = L(P.env[0],P.env[1],m);
  renderer.toneMappingExposure = L(P.exp[0],P.exp[1],m);
  bloom.strength = L(P.bloom[0],P.bloom[1],m);
  shaftMat.uniforms.uC.value.lerpColors(P.shaftC[0],P.shaftC[1],m); shaftMat.uniforms.uI.value = L(P.shaftI[0],P.shaftI[1],m);
  wallMat.color.lerpColors(P.wall[0],P.wall[1],m);
  dustMat.color.lerpColors(P.dust[0],P.dust[1],m);
  for(const g of glows){ g.mat.color.lerpColors(g.a,g.b,m); if(g.neon && flick<1) g.mat.color.multiplyScalar(flick); }
  carMat.color.setScalar(L(0.9,3.0,m));
  balloonMat.color.setScalar(L(1.0,0.35,m));
  skyMat.uniforms.uMix.value = m; bMat.uniforms.uMix.value = m;
  if(Math.abs(m-lastBg) > 0.002){ drawBg(m); lastBg = m; }
}

/* ---------- toggle ---------- */
const btn = document.getElementById('mode'), lbl = btn.querySelector('.lbl');
let mix = location.hash === '#night' ? 1 : 0, from = mix, to = mix, tStart = -1;
const DUR = reduceMotion ? 0.3 : 1.9;
function syncUi(){
  const night = to > 0.5;
  document.body.classList.toggle('night', night);
  lbl.textContent = night ? 'Night' : 'Sunset';
  btn.setAttribute('aria-pressed', String(night));
  btn.setAttribute('aria-label', night ? 'Switch to sunset mode' : 'Switch to night mode');
}
function toggle(){ from = mix; to = to > 0.5 ? 0 : 1; tStart = clock.getElapsedTime(); syncUi(); }
btn.addEventListener('click', toggle);
addEventListener('keydown', e=>{ if((e.code==='Space' || e.key==='n') && e.target!==btn){ e.preventDefault(); toggle(); } });
syncUi();

/* ---------- pointer sway ---------- */
const sway = { x:0, y:0, tx:0, ty:0 };
addEventListener('pointermove', e=>{ sway.tx = e.clientX/innerWidth*2-1; sway.ty = e.clientY/innerHeight*2-1; });
const az0 = Math.atan2(baseDir.x, baseDir.z), el0 = Math.asin(baseDir.y);
const tmpDir = new THREE.Vector3(), viewDir = new THREE.Vector3();
const ease = p=>p<.5 ? 4*p*p*p : 1-Math.pow(-2*p+2,3)/2;

/* ---------- loop ---------- */
const clock = new THREE.Clock();
const m4 = new THREE.Matrix4();
let frame = 0;
function tick(){
  const t = clock.getElapsedTime();
  let flick = 1;
  if(tStart >= 0){
    const p = Math.min(1, (t - tStart)/DUR);
    mix = from + (to-from)*ease(p);
    if(to > 0.5 && p > 0.45 && p < 0.95 && !reduceMotion) flick = Math.random() > 0.3 ? 1 : 0.15;
    if(p >= 1) tStart = -1;
  }
  applyMix(mix, flick);

  // camera: gentle drift + pointer parallax
  const k = reduceMotion ? 0 : 1;
  sway.x += (sway.tx - sway.x)*0.04; sway.y += (sway.ty - sway.y)*0.04;
  const az = az0 + k*(sway.x*0.09 + Math.sin(t*0.13)*0.008);
  const el = el0 + k*(sway.y*0.05 + Math.sin(t*0.1)*0.004);
  tmpDir.set(Math.sin(az)*Math.cos(el), Math.sin(el), Math.cos(az)*Math.cos(el));
  camera.position.copy(target).addScaledVector(tmpDir, CAM_DIST); camera.lookAt(target);
  viewDir.copy(tmpDir).negate();
  camera.updateMatrixWorld(); updateWinQuad();
  sky.position.copy(Wc).addScaledVector(viewDir, 150); sky.quaternion.copy(camera.quaternion);

  skyMat.uniforms.uTime.value = t; bMat.uniforms.uTime.value = t;

  // traffic
  cars.forEach((c,i)=>{
    const lim = 4.5 + c.ln.t*0.1;
    c.sx += c.ln.dir*c.sp*0.016*k; if(c.sx > lim) c.sx = -lim; if(c.sx < -lim) c.sx = lim;
    const p = cityPoint(c.ln.t, c.sx, c.ln.sy + c.dy);
    m4.compose(p, carQ, V(1,1,1)); carMesh.setMatrixAt(i, m4);
  });
  carMesh.instanceMatrix.needsUpdate = true;
  holos.forEach(h=>{ const f = 0.85 + 0.15*Math.sin(t*9 + h.ph) * (Math.sin(t*0.7+h.ph) > 0.92 ? 3 : 1); h.mat.opacity = L(0.14, 0.95, mix)*Math.max(0.2,f); h.mat.color.setScalar(L(0.8,1.15,mix)); });

  // life
  if(k){
    tBody.scale.y = 1.1*(1 + Math.sin(t*1.6)*0.015);
    mobile.rotation.y = t*0.35;
    balloons.forEach(b=>{ b.g.position.copy(cityPoint(b.t, b.sx + Math.sin(t*0.05+b.ph)*0.4, b.sy + Math.sin(t*0.6+b.ph)*0.06)); });
    leaves.forEach(l=>{ l.pivot.rotation.y = l.base + Math.sin(t*0.8 + l.ph)*0.04; });
    curtain.rotation.y = Math.sin(t*0.6)*0.03;
  }
  frame++;

  composer.render();
  if(frame === 2) renderer.domElement.classList.add('on');
  requestAnimationFrame(tick);
}
applyMix(mix);
requestAnimationFrame(tick);
</script>
